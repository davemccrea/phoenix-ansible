---
- name: Create backup directory
  ansible.builtin.file:
    path: "/opt/{{ project_name }}/backups"
    state: directory
    owner: postgres
    mode: "0750"

- name: Schedule daily pg_dump
  ansible.builtin.cron:
    name: "Backup {{ db_name }}"
    hour: "2"
    minute: "0"
    user: postgres
    job: >-
      pg_dump -Fc {{ db_name }} > /opt/{{ project_name }}/backups/{{ db_name }}_$(date +\%Y\%m\%dT\%H\%M\%S).dump
