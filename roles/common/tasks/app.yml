---
- name: Create app directory
  ansible.builtin.file:
    path: "/opt/{{ project_name }}"
    state: directory
    owner: "{{ user }}"
    mode: "0755"

- name: Create images directory
  ansible.builtin.file:
    path: "/opt/{{ project_name }}/images"
    state: directory
    owner: "{{ user }}"
    mode: "0755"

- name: Fix images permissions every 5 minutes
  ansible.builtin.cron:
    name: "Fix imgproxy image permissions"
    minute: "*/5"
    job: "find /opt/{{ project_name }}/images -type f -exec chmod 644 {} \\; 2>/dev/null"
    user: root

- name: Place docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "/opt/{{ project_name }}/docker-compose.yml"
    owner: "{{ user }}"
    mode: "0644"
  notify: Recreate container
